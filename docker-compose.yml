services:
  qr-live:
    build:
      context: .
      dockerfile: Dockerfile
    # Optional: a missing .env is not an error (defaults below apply).
    # Long syntax needs Docker Compose >= 2.24; on older versions use
    # `env_file: [.env]` and always create .env first.
    env_file:
      - path: .env
        required: false
    # Compose reads the project .env for interpolation, so .env wins over the
    # defaults here. Keeping the full list explicit means a clean checkout
    # still starts with the documented defaults, without a .env file.
    environment:
      PORT_HTTP: ${PORT_HTTP:-41601}
      PORT_WS: ${PORT_WS:-41602}
      CHANNEL_TTL_SECONDS: ${CHANNEL_TTL_SECONDS:-1800}
      CLEANUP_INTERVAL_SECONDS: ${CLEANUP_INTERVAL_SECONDS:-60}
      UPLOAD_RATE_LIMIT: ${UPLOAD_RATE_LIMIT:-2}
      MAX_VIEWERS_PER_CHANNEL: ${MAX_VIEWERS_PER_CHANNEL:-50}
      VERIFY_RATE_LIMIT: ${VERIFY_RATE_LIMIT:-10}
      MAX_TEXT_LENGTH: ${MAX_TEXT_LENGTH:-2000}
      TRUST_PROXY: ${TRUST_PROXY:-loopback}
      CREATE_RATE_LIMIT: ${CREATE_RATE_LIMIT:-10}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-}
      # ── Audit log (contains PLAINTEXT uploads + IP/UA) ──────────────────
      # On by default; set false for a strictly metadata-only deployment.
      AUDIT_LOG_ENABLED: ${AUDIT_LOG_ENABLED:-true}
      # Fixed to the named-volume mount point. Do not point this at "logs":
      # that would write inside the container and disappear on rebuild.
      AUDIT_LOG_DIR: /var/log/live-qr
      AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-243}
      # Default: TLS terminated at the edge, container speaks plain HTTP on :80.
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:80}
    ports:
      # Host port is configurable; the container port stays 80.
      - "${LIVE_QR_PORT:-41606}:80"
      # ── Optional in-container TLS ─────────────────────────────────────────
      # 1. set CADDY_SITE_ADDRESS=qr.example.com in .env
      # 2. publish 443 by uncommenting the mapping below
      # 3. persist certificates: uncomment caddy-data below + its top-level entry
      # 4. make sure nothing else terminates TLS in front of this container
      #    (the edge proxy must be removed for the ACME challenge to arrive)
      # - "443:443"
    healthcheck:
      test:
        - CMD-SHELL
        - |
          node -e "fetch('http://127.0.0.1:' + (process.env.PORT_HTTP || 41601) + '/api/health').then(r => r.json()).then(j => process.exit(j.status === 'ok' ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    # docker stop sends SIGTERM; entrypoint.sh gives node + caddy 10s to exit.
    stop_grace_period: 20s
    restart: unless-stopped
    volumes:
      # Audit log JSONL (one file per UTC day, 0600, dir 0700). It records the
      # plaintext of every uploaded text plus uploader/recipient IP + UA, so
      # treat the host and this volume as sensitive.
      #
      # MUST be a named volume, not a bind mount: the container runs as uid
      # 10001, while Docker creates a bind-mount host directory as root:root,
      # so the app cannot write (EACCES). The volume survives container
      # re-create and image rebuilds; `docker compose down -v` deletes it.
      #
      # Retention is in-app (AUDIT_LOG_RETENTION_DAYS, default 243 days);
      # size still grows with traffic — monitor the volume.
      # Back up (reads through the container; the volume's real name is
      # prefixed by the compose project, e.g. live-qr_live-qr-logs):
      #   docker compose exec -T qr-live tar czf - -C /var/log/live-qr . \
      #     > live-qr-logs.tgz
      # List / delete manually:
      #   docker compose exec qr-live ls -l /var/log/live-qr
      #   docker compose exec qr-live rm /var/log/live-qr/transfer-2026-01-01.jsonl
      - live-qr-logs:/var/log/live-qr
      # Optional in-container TLS (see above): persist ACME state, otherwise
      # every rebuild re-issues a certificate.
      # - caddy-data:/srv/caddy/data

volumes:
  live-qr-logs:
  # caddy-data:
